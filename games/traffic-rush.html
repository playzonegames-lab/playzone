<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traffic Rush - PlayZone</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        header {
            background: #111827;
            padding: 15px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            margin: 15px 0;
        }

        #game {
            position: relative;
            width: 360px;
            height: 600px;
            max-width: 95vw;
            margin: 20px auto;
            background: #444;
            overflow: hidden;
            border-left: 8px solid #222;
            border-right: 8px solid #222;
        }

        .road-line {
            position: absolute;
            width: 8px;
            height: 70px;
            background: white;
            left: 50%;
            transform: translateX(-50%);
        }

        #player {
            position: absolute;
            width: 50px;
            height: 90px;
            background: #38bdf8;
            border-radius: 10px;
            bottom: 25px;
            left: 155px;
            border: 4px solid white;
        }

        #player::before,
        #player::after {
            content: "";
            position: absolute;
            width: 9px;
            height: 22px;
            background: #111;
            top: 12px;
            border-radius: 4px;
        }

        #player::before {
            left: -7px;
        }

        #player::after {
            right: -7px;
        }

        .enemy {
            position: absolute;
            width: 50px;
            height: 90px;
            background: #ef4444;
            border-radius: 10px;
            border: 4px solid white;
        }

        .enemy::before,
        .enemy::after {
            content: "";
            position: absolute;
            width: 9px;
            height: 22px;
            background: #111;
            bottom: 12px;
            border-radius: 4px;
        }

        .enemy::before {
            left: -7px;
        }

        .enemy::after {
            right: -7px;
        }

        #score {
            font-size: 22px;
            font-weight: bold;
            margin: 10px;
        }

        #message {
            font-size: 20px;
            margin: 15px;
            min-height: 25px;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        button:active {
            transform: scale(0.96);
        }

        .controls {
            margin: 10px auto 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .controls button {
            width: 90px;
            height: 55px;
            font-size: 25px;
        }
    </style>
</head>

<body>

<header>
    <a href="../index.html">⬅️ Retour à PlayZone</a>
</header>

<h1>🚗 Traffic Rush</h1>

<div id="score">Score : 0</div>

<div id="game">

    <div class="road-line" style="top: 0;"></div>
    <div class="road-line" style="top: 150px;"></div>
    <div class="road-line" style="top: 300px;"></div>
    <div class="road-line" style="top: 450px;"></div>

    <div id="player"></div>

</div>

<div id="message">
    Évite les voitures !
</div>

<div class="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
</div>

<button id="restart">🔄 Recommencer</button>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");
const restartButton = document.getElementById("restart");

let playerX;
let enemies;
let score;
let speed;
let gameRunning;
let keys = {};

function startGame() {

    playerX = 155;
    player.style.left = playerX + "px";

    enemies = [];
    score = 0;
    speed = 4;
    gameRunning = true;

    scoreText.textContent = "Score : 0";
    message.textContent = "Évite les voitures !";

    document.querySelectorAll(".enemy").forEach(car => car.remove());

    createEnemy();

    requestAnimationFrame(gameLoop);
}

function createEnemy() {

    if (!gameRunning) return;

    const enemy = document.createElement("div");

    enemy.className = "enemy";

    const lanes = [45, 155, 265];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];

    enemy.style.left = lane + "px";
    enemy.style.top = "-100px";

    game.appendChild(enemy);

    enemies.push({
        element: enemy,
        y: -100
    });
}

function movePlayer() {

    if (keys["ArrowLeft"]) {
        playerX -= 6;
    }

    if (keys["ArrowRight"]) {
        playerX += 6;
    }

    if (playerX < 10) {
        playerX = 10;
    }

    if (playerX > 300) {
        playerX = 300;
    }

    player.style.left = playerX + "px";
}

function checkCollision(a, b) {

    const rect1 = a.getBoundingClientRect();
    const rect2 = b.getBoundingClientRect();

    return !(
        rect1.bottom < rect2.top ||
        rect1.top > rect2.bottom ||
        rect1.right < rect2.left ||
        rect1.left > rect2.right
    );
}

function gameLoop() {

    if (!gameRunning) return;

    movePlayer();

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        enemy.y += speed;

        enemy.element.style.top = enemy.y + "px";

        if (checkCollision(player, enemy.element)) {

            gameRunning = false;

            message.textContent = "💥 Perdu ! Score : " + score;

            return;
        }

        if (enemy.y > 620) {

            enemy.element.remove();

            enemies.splice(i, 1);

            score++;

            scoreText.textContent = "Score : " + score;

            if (score % 5 === 0) {
                speed += 0.7;
            }
        }
    }

    if (
        enemies.length === 0 ||
        enemies[enemies.length - 1].y > 150
    ) {
        createEnemy();
    }

    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", event => {

    keys[event.key] = true;

});

document.addEventListener("keyup", event => {

    keys[event.key] = false;

});

leftButton.addEventListener("touchstart", event => {

    event.preventDefault();
    keys["ArrowLeft"] = true;

});

leftButton.addEventListener("touchend", event => {

    event.preventDefault();
    keys["ArrowLeft"] = false;

});

rightButton.addEventListener("touchstart", event => {

    event.preventDefault();
    keys["ArrowRight"] = true;

});

rightButton.addEventListener("touchend", event => {

    event.preventDefault();
    keys["ArrowRight"] = false;

});

leftButton.addEventListener("mousedown", () => {

    keys["ArrowLeft"] = true;

});

leftButton.addEventListener("mouseup", () => {

    keys["ArrowLeft"] = false;

});

rightButton.addEventListener("mousedown", () => {

    keys["ArrowRight"] = true;

});

rightButton.addEventListener("mouseup", () => {

    keys["ArrowRight"] = false;

});

restartButton.addEventListener("click", startGame);

startGame();

</script>

</body>
</html>
