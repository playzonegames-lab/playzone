
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course de voiture</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
    }

    #score {
      font-size: 22px;
      margin: 12px;
    }

    canvas {
      display: block;
      margin: 0 auto;
      width: min(95vw, 360px);
      height: auto;
      background: #333;
      border: 3px solid white;
      border-radius: 8px;
    }

    button {
      margin: 12px 5px;
      padding: 14px 22px;
      border: none;
      border-radius: 8px;
      background: #20c55a;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🏎️ Course de voiture</h1>
  <div id="score">Score : 0</div>

  <canvas id="game" width="360" height="600"></canvas>

  <div>
    <button id="left">⬅️ Gauche</button>
    <button id="right">Droite ➡️</button>
  </div>
  <button id="start">Commencer la course</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");

    const car = {
      x: 155,
      y: 475,
      width: 50,
      height: 85,
      speed: 5
    };

    let obstacles = [];
    let score = 0;
    let running = false;
    let animation;
    let lastObstacle = 0;

    function drawCar(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 50, 85);

      ctx.fillStyle = "#bdeaff";
      ctx.fillRect(x + 8, y + 10, 34, 20);

      ctx.fillStyle = "#222";
      ctx.fillRect(x - 5, y + 12, 7, 20);
      ctx.fillRect(x + 48, y + 12, 7, 20);
      ctx.fillRect(x - 5, y + 55, 7, 20);
      ctx.fillRect(x + 48, y + 55, 7, 20);
    }

    function drawRoad() {
      ctx.fillStyle = "#333";
      ctx.fillRect(0, 0, 360, 600);

      ctx.fillStyle = "#eee";
      ctx.fillRect(10, 0, 5, 600);
      ctx.fillRect(345, 0, 5, 600);

      ctx.fillStyle = "#aaa";
      for (let y = 0; y < 600; y += 80) {
        ctx.fillRect(118, (y + score * 3) % 600, 5, 40);
        ctx.fillRect(237, (y + score * 3) % 600, 5, 40);
      }
    }

    function draw() {
      drawRoad();
      drawCar(car.x, car.y, "#16a34a");

      obstacles.forEach(obstacle => {
        drawCar(obstacle.x, obstacle.y, "#ef4444");
      });
    }

    function endGame() {
      running = false;
      cancelAnimationFrame(animation);
      draw();

      ctx.fillStyle = "rgba(0,0,0,0.75)";
      ctx.fillRect(25, 235, 310, 120);

      ctx.fillStyle = "white";
      ctx.textAlign = "center";
      ctx.font = "bold 25px Arial";
      ctx.fillText("Course terminée !", 180, 280);
      ctx.font = "20px Arial";
      ctx.fillText("Score : " + score, 180, 320);
    }

    function loop(timestamp) {
      if (!running) return;

      if (timestamp - lastObstacle > 1000) {
        obstacles.push({
          x: [35, 155, 275][Math.floor(Math.random() * 3)],
          y: -90
        });
        lastObstacle = timestamp;
      }

      obstacles.forEach(obstacle => {
        obstacle.y += 4;

        if (
          car.x < obstacle.x + 50 &&
          car.x + car.width > obstacle.x &&
          car.y < obstacle.y + 85 &&
          car.y + car.height > obstacle.y
        ) {
          endGame();
        }
      });

      if (!running) return;

      obstacles = obstacles.filter(obstacle => {
        if (obstacle.y > 600) {
          score++;
          scoreDisplay.textContent = "Score : " + score;
          return false;
        }
        return true;
      });

      draw();
      animation = requestAnimationFrame(loop);
    }

    function moveCar(direction) {
      if (!running) return;
      car.x += direction * 60;
      car.x = Math.max(20, Math.min(290, car.x));
    }

    document.getElementById("left").addEventListener("click", () => moveCar(-1));
    document.getElementById("right").addEventListener("click", () => moveCar(1));

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") moveCar(-1);
      if (event.key === "ArrowRight") moveCar(1);
    });

    document.getElementById("start").addEventListener("click", () => {
      cancelAnimationFrame(animation);
      car.x = 155;
      obstacles = [];
      score = 0;
      lastObstacle = 0;
      running = true;
      scoreDisplay.textContent = "Score : 0";
      animation = requestAnimationFrame(loop);
    });

    draw();
  </script>
</body>
</html>
